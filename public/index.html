<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>胚胎非整倍体及中西结合融合诊疗系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
        html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0a1628 0%,#1a365d 30%,#2c5f8e 60%,#4a90d9 100%);min-height:100vh;color:#fff;overflow-x:hidden;-webkit-text-size-adjust:100%}
        .container{max-width:800px;margin:0 auto;padding:20px;min-height:100vh}
        .role-bar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,22,40,0.95);border-bottom:1px solid rgba(255,255,255,0.1);padding:10px 20px;display:flex;justify-content:space-between;align-items:center}
        .role-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:0.85rem;font-weight:600}
        .role-patient{background:rgba(46,204,113,0.2);color:#2ecc71;border:1px solid rgba(46,204,113,0.4)}
        .role-doctor{background:rgba(0,198,255,0.2);color:#00c6ff;border:1px solid rgba(0,198,255,0.4)}
        .role-switch-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;padding:6px 14px;border-radius:20px;font-size:0.8rem;cursor:pointer;-webkit-appearance:none}
        .card{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:25px;margin-bottom:15px}
        .card h3{font-size:1.1rem;margin-bottom:15px;color:#a8d8ff;display:flex;align-items:center;gap:8px}
        .card p,.card li{font-size:0.9rem;line-height:1.7;color:rgba(255,255,255,0.85)}
        .card ul{padding-left:20px;margin-top:8px}
        .page{display:none;min-height:100vh;animation:fadeIn 0.6s ease-out;padding-top:60px;padding-bottom:40px}
        .page.active{display:block}
        .role-select-page{text-align:center;padding-top:80px}
        .main-title{font-size:1.7rem;font-weight:700;margin-bottom:15px;line-height:1.3;background:linear-gradient(90deg,#fff,#a8d8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{font-size:1rem;color:rgba(255,255,255,0.85);margin-bottom:30px;max-width:600px;margin-left:auto;margin-right:auto}
        .role-cards{display:flex;gap:20px;width:100%;max-width:500px;margin:20px auto 0}
        .role-card{flex:1;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.15);border-radius:20px;padding:35px 20px;cursor:pointer;transition:all 0.3s;text-align:center}
        .role-card:hover{transform:translateY(-4px);border-color:rgba(0,198,255,0.5);background:rgba(255,255,255,0.12)}
        .role-icon{font-size:3rem;margin-bottom:15px}
        .patient-info-page{padding-top:70px}
        .info-form{width:100%;max-width:500px;margin:0 auto}
        .form-group{margin-bottom:18px}
        .form-label{display:block;font-size:0.9rem;margin-bottom:8px;color:rgba(255,255,255,0.9)}
        .form-label .required{color:#e74c3c;margin-left:4px}
        .input-field{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:white;font-size:1rem;-webkit-appearance:none}
        .input-field::placeholder{color:rgba(255,255,255,0.4)}
        .input-field:focus{border-color:#00c6ff;background:rgba(255,255,255,0.08)}
        .radio-group{display:flex;gap:15px;flex-wrap:wrap}
        .radio-item{flex:1;min-width:100px;padding:12px;border-radius:12px;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);text-align:center;cursor:pointer;transition:all 0.25s;font-size:0.9rem}
        .radio-item.active{border-color:#00c6ff;background:rgba(0,198,255,0.15)}
        .btn{padding:14px 30px;border-radius:12px;border:none;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.3s;-webkit-appearance:none;text-align:center;display:inline-block}
        .btn-primary{background:linear-gradient(135deg,#00c6ff,#0072ff);color:white;box-shadow:0 4px 20px rgba(0,114,255,0.4)}
        .btn-primary:hover{transform:translateY(-2px)}
        .btn-success{background:linear-gradient(135deg,#2ecc71,#27ae60);color:white;box-shadow:0 4px 15px rgba(46,204,113,0.4)}
        .btn-warning{background:linear-gradient(135deg,#f1c40f,#e67e22);color:white;box-shadow:0 4px 20px rgba(241,196,15,0.4)}
        .btn-secondary{background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.3)}
        .btn-danger{background:linear-gradient(135deg,#e74c3c,#c0392b);color:white}
        .btn-block{width:100%;display:block}
        .btn-large{padding:16px;font-size:1.1rem;border-radius:50px}
        .patient-welcome{text-align:center}
        .feature-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px;justify-content:center}
        .tag{background:rgba(168,216,255,0.2);border:1px solid rgba(168,216,255,0.4);padding:5px 12px;border-radius:20px;font-size:0.8rem;color:#a8d8ff}
        .pulse{animation:pulse 2.5s infinite}
        .quiz-page{padding-top:50px}
        .progress-container{position:sticky;top:50px;z-index:100;background:rgba(10,22,40,0.9);padding:12px 0;margin:0 -20px 20px -20px;padding-left:20px;padding-right:20px}
        .progress-bar{width:100%;height:6px;background:rgba(255,255,255,0.15);border-radius:4px;overflow:hidden}
        .progress-fill{height:100%;background:linear-gradient(90deg,#00c6ff,#0072ff);border-radius:4px;transition:width 0.4s}
        .progress-text{text-align:center;margin-top:6px;font-size:0.8rem;color:rgba(255,255,255,0.7)}
        .question-number{font-size:0.85rem;color:#a8d8ff;margin-bottom:8px;font-weight:500}
        .question-text{font-size:1.1rem;font-weight:600;line-height:1.5;margin-bottom:20px}
        .options-container{display:flex;flex-direction:column;gap:10px}
        .option-btn{background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.15);color:white;padding:14px 16px;border-radius:12px;cursor:pointer;font-size:0.95rem;text-align:left;transition:all 0.25s;display:flex;align-items:center;gap:10px}
        .option-btn:hover,.option-btn.selected{background:rgba(0,198,255,0.2);border-color:#00c6ff}
        .option-letter{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:0.85rem;flex-shrink:0}
        .option-btn.selected .option-letter{background:#00c6ff;color:#0a1628}
        .nav-buttons{display:flex;justify-content:space-between;margin-top:15px;gap:12px;padding-bottom:20px}
        .nav-btn{padding:12px 24px;border-radius:12px;border:none;font-size:0.95rem;font-weight:500;cursor:pointer;transition:all 0.3s}
        .nav-btn-prev{background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2)}
        .nav-btn-next{background:linear-gradient(135deg,#00c6ff,#0072ff);color:white;flex:1}
        .nav-btn:disabled{opacity:0.4;cursor:not-allowed}
        .result-summary-page{text-align:center}
        .result-header{text-align:center;padding:20px 0}
        .result-badge{display:inline-block;padding:6px 20px;border-radius:20px;font-size:0.85rem;font-weight:600;margin-bottom:12px}
        .badge-low{background:rgba(46,204,113,0.2);color:#2ecc71;border:1px solid rgba(46,204,113,0.4)}
        .badge-moderate{background:rgba(241,196,15,0.2);color:#f1c40f;border:1px solid rgba(241,196,15,0.4)}
        .badge-high{background:rgba(230,126,34,0.2);color:#e67e22;border:1px solid rgba(230,126,34,0.4)}
        .badge-very-high{background:rgba(231,76,60,0.2);color:#e74c3c;border:1px solid rgba(231,76,60,0.4)}
        .result-title{font-size:1.4rem;font-weight:700;margin-bottom:8px}
        .result-subtitle{color:rgba(255,255,255,0.7);font-size:0.9rem}
        .chart-container{height:280px;position:relative;padding:20px}
        .lock-overlay{background:rgba(10,22,40,0.95);border:2px dashed rgba(231,76,60,0.5);border-radius:20px;padding:35px 25px;text-align:center;margin:15px 0}
        .lock-icon{font-size:3rem;margin-bottom:15px}
        .price-tag{font-size:2rem;font-weight:700;color:#f1c40f;margin-bottom:5px}
        .price-note{font-size:0.8rem;color:rgba(255,255,255,0.5);margin-bottom:20px}
        .preview-hint{margin-top:15px;padding:15px;background:rgba(255,255,255,0.05);border-radius:12px;font-size:0.85rem;color:rgba(255,255,255,0.6);text-align:left}
        .action-buttons{display:flex;gap:12px;margin-top:20px;margin-bottom:30px}
        .action-btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all 0.3s;text-align:center}
        .payment-page{text-align:center}
        .payment-box{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:30px 25px;width:100%;max-width:450px;margin:0 auto}
        .payment-box h2{margin-bottom:10px;color:#a8d8ff}
        .payment-amount{font-size:2.5rem;font-weight:700;color:#f1c40f;margin:15px 0}
        .payment-info{text-align:left;margin:15px 0;padding:15px;background:rgba(255,255,255,0.05);border-radius:12px}
        .payment-info p{font-size:0.85rem;color:rgba(255,255,255,0.7);margin-bottom:6px}
        .payment-info p strong{color:rgba(255,255,255,0.9)}
        .config-info{background:rgba(7,193,96,0.1);border:1px solid rgba(7,193,96,0.3);border-radius:12px;padding:15px;margin:15px 0;text-align:left}
        .config-info h4{color:#07c160;font-size:0.9rem;margin-bottom:10px}
        .config-info p{font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:5px}
        .env-tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.75rem;font-weight:500;margin-bottom:10px}
        .env-wx{background:rgba(7,193,96,0.15);color:#07c160;border:1px solid rgba(7,193,96,0.3)}
        .env-browser{background:rgba(168,216,255,0.15);color:#a8d8ff;border:1px solid rgba(168,216,255,0.3)}
        .full-report-page{text-align:center}
        .paid-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:0.8rem;font-weight:600;background:rgba(46,204,113,0.2);color:#2ecc71;border:1px solid rgba(46,204,113,0.4);margin-bottom:10px}
        .audit-pending{background:rgba(241,196,15,0.2);color:#f1c40f;border:1px solid rgba(241,196,15,0.4)}
        .detail-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1)}
        .detail-bar{width:80px;height:5px;background:rgba(255,255,255,0.15);border-radius:3px;overflow:hidden;margin-left:8px}
        .detail-bar-fill{height:100%;border-radius:3px;transition:width 0.8s}
        .treatment-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:15px;margin-bottom:12px;text-align:left}
        .treatment-card h4{font-size:0.95rem;margin-bottom:8px}
        .treatment-card p,.treatment-card li{font-size:0.85rem;line-height:1.7;color:rgba(255,255,255,0.8)}
        .treatment-card ul{padding-left:18px;margin-top:6px}
        .highlight-box{background:rgba(0,198,255,0.1);border-left:4px solid #00c6ff;padding:12px;border-radius:0 10px 10px 0;margin:12px 0;text-align:left}
        .highlight-box p{font-size:0.85rem;line-height:1.7}
        .doctor-login-page{text-align:center;padding-top:80px}
        .login-box{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:40px 30px;width:100%;max-width:400px;margin:0 auto}
        .login-hint{margin-top:15px;font-size:0.8rem;color:rgba(255,255,255,0.5)}
        .doctor-dashboard{padding-top:60px}
        .dashboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
        .stat-card{flex:1;min-width:70px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:15px;text-align:center}
        .stat-number{font-size:1.5rem;font-weight:700;color:#00c6ff}
        .stat-label{font-size:0.75rem;color:rgba(255,255,255,0.6);margin-top:4px}
        .patient-list{display:flex;flex-direction:column;gap:12px}
        .patient-item{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:18px;cursor:pointer;transition:all 0.3s;display:flex;justify-content:space-between;align-items:center}
        .patient-item:hover{background:rgba(255,255,255,0.12)}
        .patient-risk{padding:4px 12px;border-radius:12px;font-size:0.8rem;font-weight:600}
        .risk-low{background:rgba(46,204,113,0.2);color:#2ecc71}
        .risk-moderate{background:rgba(241,196,15,0.2);color:#f1c40f}
        .risk-high{background:rgba(230,126,34,0.2);color:#e67e22}
        .risk-very-high{background:rgba(231,76,60,0.2);color:#e74c3c}
        .pay-status{font-size:0.75rem;padding:2px 8px;border-radius:8px;margin-left:6px}
        .paid{background:rgba(46,204,113,0.3);color:#2ecc71}
        .unpaid{background:rgba(231,76,60,0.3);color:#e74c3c}
        .audit-panel{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:25px;margin-bottom:20px}
        .audit-textarea{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:white;font-size:0.9rem;min-height:80px;resize:vertical;-webkit-appearance:none;margin-bottom:15px}
        .audit-actions{display:flex;gap:12px;flex-wrap:wrap}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
        .modal-overlay.active{display:flex}
        .modal-box{background:linear-gradient(135deg,#1a365d,#0a1628);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:30px;max-width:450px;width:100%;text-align:center}
        .modal-box h3{font-size:1.2rem;margin-bottom:15px}
        .modal-box p{font-size:0.9rem;color:rgba(255,255,255,0.8);margin-bottom:20px;line-height:1.6;white-space:pre-line}
        .pay-success-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:4000;display:none;align-items:center;justify-content:center;flex-direction:column}
        .pay-success-overlay.active{display:flex}
        .pay-success-icon{font-size:4rem;margin-bottom:15px}
        .qrcode-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:3000;display:none;align-items:center;justify-content:center;padding:20px}
        .qrcode-overlay.active{display:flex}
        .qrcode-box{background:linear-gradient(135deg,#1a365d,#0a1628);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:30px;max-width:400px;width:100%;text-align:center}
        .qrcode-box h3{font-size:1.2rem;margin-bottom:10px;color:#a8d8ff}
        .qrcode-box p{font-size:0.85rem;color:rgba(255,255,255,0.7);margin-bottom:15px}
        .qrcode-image{width:200px;height:200px;background:white;border-radius:10px;margin:0 auto 15px;padding:10px}
        .qrcode-image img{width:100%;height:100%;object-fit:contain}
        .qrcode-tips{background:rgba(7,193,96,0.1);border:1px solid rgba(7,193,96,0.3);border-radius:10px;padding:12px;margin-bottom:15px;font-size:0.85rem;color:rgba(255,255,255,0.8);text-align:left}
        .qrcode-status{font-size:0.9rem;color:#f1c40f;margin-bottom:15px}
        .qrcode-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#f1c40f;border-radius:50%;animation:spin 1s linear infinite;margin-right:6px;vertical-align:middle}
        .qrcode-countdown{font-size:0.75rem;color:rgba(255,255,255,0.5);margin-top:5px}
        .btn-refresh{display:none}
        .btn-refresh.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media(max-width:600px){.main-title{font-size:1.4rem}.role-cards{flex-direction:column}.stats-row{flex-direction:column}.chart-container{height:240px}}
    </style>
</head>
<body>
    <div class="role-bar" id="roleBar" style="display:none">
        <span class="role-badge" id="currentRoleBadge"></span>
        <button class="role-switch-btn" onclick="switchRole()">切换角色</button>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3 id="modalTitle">提示</h3>
            <p id="modalMessage">消息内容</p>
            <div style="display:flex;gap:10px;justify-content:center">
                <button class="btn btn-primary" onclick="closeModal()">确定</button>
            </div>
        </div>
    </div>
    <div class="pay-success-overlay" id="paySuccessOverlay">
        <div class="pay-success-icon">&#9989;</div>
        <div style="font-size:1.5rem;font-weight:700;color:#2ecc71;margin-bottom:10px" id="paySuccessTitle">支付成功</div>
        <div style="color:rgba(255,255,255,0.7)" id="paySuccessSubtitle">正在为您生成完整报告...</div>
    </div>
    <div class="qrcode-overlay" id="qrcodeOverlay">
        <div class="qrcode-box">
            <h3>&#128254; 微信扫码支付</h3>
            <p>请使用微信扫描下方二维码完成支付</p>
            <div class="qrcode-image" id="qrcodeImage">
                <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#333;font-size:0.8rem">
                    <span style="display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,0.2);border-top-color:#07c160;border-radius:50%;animation:spin 1s linear infinite;margin-right:8px"></span>
                    正在生成二维码...
                </div>
            </div>
            <div class="qrcode-tips">
                <strong>&#128161; 支付方式（三选一）：</strong><br>
                方式一：用另一台设备的微信「扫一扫」<br>
                方式二：长按上方二维码 → 识别图中二维码<br>
                方式三：截图保存二维码 → 打开微信相册识别
            </div>
            <div class="qrcode-countdown" id="qrcodeCountdown">二维码有效期：剩余 120 秒</div>
            <div class="qrcode-status" id="qrcodeStatus">
                <span class="qrcode-spinner"></span>等待扫码支付...
            </div>
            <div style="display:flex;gap:10px">
                <button class="btn btn-secondary" style="flex:1" onclick="closeQrcode()">取消支付</button>
                <button class="btn btn-success" style="flex:1" onclick="checkPayStatusManual()">我已支付</button>
                <button class="btn btn-primary btn-refresh" style="flex:1" id="btnRefreshQrcode" onclick="refreshQrcode()">刷新二维码</button>
            </div>
        </div>
    </div>
